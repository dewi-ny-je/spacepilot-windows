name: Build
# Shared Windows build, called by the PR checks, package and release workflows.
on:
  workflow_call:
    inputs:
      version:
        description: Product version (1.2.3 or 1.2.3-beta.1); empty uses the CMake default
        type: string
        default: ''
      tests:
        description: Run the native and app model tests
        type: boolean
        default: true
      package:
        description: Publish the app and package the installer and portable zip
        type: boolean
        default: false
    outputs:
      version:
        description: The product version that was built
        value: ${{ jobs.windows.outputs.version }}
      artifact:
        description: Name of the uploaded package artifact
        value: ${{ jobs.windows.outputs.artifact }}

permissions:
  contents: read

env:
  OPENSSL_VERSION: 3.5.9
  OPENSSL_SHA256: 603F5602E2EEF00D77FBD429D34DCD5822BB301757A1BC9CDB24C670F1EB859A
  DOTNET_VERSION: 10.0.x
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      # The full version names the installer; binaries and the installer's file
      # version use its numeric part, which Windows requires.
      - name: Version
        id: version
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED
          if (-not $version) { $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'set\(AXIAL_VERSION "([0-9.]+)"').Groups[1].Value }
          $parsed = [regex]::Match($version, '^(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$')
          if (-not $parsed.Success) { throw "Versions must look like 1.2.3 or 1.2.3-beta.1, not $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$($parsed.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "artifact=Axial-$version-Windows" >> $env:GITHUB_OUTPUT
      - name: Cache OpenSSL
        id: tls
        uses: actions/cache@v6
        with:
          path: C:\axial-tls\x64
          key: openssl-${{ env.OPENSSL_VERSION }}-msvc-x64-static-v1
      - name: Build OpenSSL (static, /MT)
        if: steps.tls.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Load the x64 compiler environment for nmake and cl.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Set-Content vcvars.cmd "@call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul`r`n@set"
          cmd /c vcvars.cmd | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] } }
          if (-not (Get-Command nmake -ErrorAction SilentlyContinue)) { throw 'The MSVC environment did not load' }
          Invoke-WebRequest "https://github.com/openssl/openssl/releases/download/openssl-$env:OPENSSL_VERSION/openssl-$env:OPENSSL_VERSION.tar.gz" -OutFile openssl.tar.gz
          if ((Get-FileHash openssl.tar.gz -Algorithm SHA256).Hash -ne $env:OPENSSL_SHA256) { throw 'OpenSSL checksum mismatch' }
          tar xf openssl.tar.gz
          Push-Location "openssl-$env:OPENSSL_VERSION"
          & C:\Strawberry\perl\bin\perl.exe Configure VC-WIN64A no-shared no-tests no-module no-asm --prefix=C:\axial-tls\x64 --openssldir=C:\axial-tls\x64\ssl
          if ($LASTEXITCODE) { throw 'OpenSSL configure failed' }
          nmake /nologo build_libs
          if ($LASTEXITCODE) { throw 'OpenSSL build failed' }
          nmake /nologo install_dev
          if ($LASTEXITCODE) { throw 'OpenSSL install failed' }
          Pop-Location
      # Arguments are quoted: PowerShell splits -DNAME=1.2.3 at the first dot.
      - name: Configure
        run: cmake --preset x64 -DAXIAL_OPENSSL_ROOT=C:\axial-tls\x64 "-DAXIAL_VERSION=${{ steps.version.outputs.numeric }}"
      - name: Build
        run: cmake --build --preset x64 --parallel
      - name: Native tests
        if: inputs.tests
        run: ctest --preset x64 --timeout 180
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: App model tests
        if: inputs.tests
        run: dotnet test app/Axial.Core.Tests -c Release "-p:AxialBridgeDirectory=${{ github.workspace }}\build\x64\bin\Release"
      - name: Build settings app
        if: ${{ !inputs.package }}
        run: dotnet build app/Axial/Axial.csproj -c Release
      - name: Publish settings app
        if: inputs.package
        run: dotnet publish app/Axial/Axial.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false "-p:Version=${{ steps.version.outputs.version }}" -o out/app
      - name: Build x86 adapters (32-bit applications)
        if: inputs.package
        shell: pwsh
        run: |
          cmake --preset x86-adapters "-DAXIAL_VERSION=${{ steps.version.outputs.numeric }}"
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset x86-adapters --parallel
          if ($LASTEXITCODE) { exit 1 }
      - name: Package installer
        if: inputs.package
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $env:PATH += ';C:\Program Files (x86)\Inno Setup 6' }
          iscc.exe "/DAppVersion=${{ steps.version.outputs.version }}" "/DFileVersion=${{ steps.version.outputs.numeric }}" "/DSourceRoot=$env:GITHUB_WORKSPACE" installer\Axial.iss
          if ($LASTEXITCODE) { exit 1 }
      # The same files as the installer, for running without installing.
      - name: Package portable zip
        if: inputs.package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "out/portable/Axial-${{ steps.version.outputs.version }}-x64"
          New-Item -ItemType Directory -Force "$root/x86" | Out-Null
          Copy-Item -Recurse out/app/* $root
          'axial-service.exe','axialctl.exe','axial-web-setup.exe','axial-bridge.dll','siappdll.dll','TDxNavLib.dll' | ForEach-Object { Copy-Item "build/x64/bin/Release/$_" $root }
          'siappdll.dll','TDxNavLib.dll' | ForEach-Object { Copy-Item "build/x86/bin/Release/$_" "$root/x86" }
          Copy-Item LICENSE, README.md $root
          Compress-Archive -Path $root -DestinationPath "out/installer/Axial-${{ steps.version.outputs.version }}-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            out/installer/*.exe
            out/installer/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs
          path: build/x64/Testing/Temporary/*.log
          if-no-files-found: ignore
