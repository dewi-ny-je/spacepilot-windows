name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENSSL_VERSION: 3.5.8
  OPENSSL_SHA256: A8F84A39918EC6415CE765D9B429D313BA97B8143169C172E734B9514464F5B2

jobs:
  windows:
    name: Windows x64 (driver, tests, app, installer)
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # A vX.Y.Z tag sets the product version; other builds use the CMake default.
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = [regex]::Match($env:GITHUB_REF_NAME, '^v(\d+\.\d+\.\d+)$')
            if (-not $tag.Success) { throw "Release tags must look like v1.2.3, not $env:GITHUB_REF_NAME" }
            $version = $tag.Groups[1].Value
          } else {
            $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'set\(AXIAL_VERSION "([0-9.]+)"').Groups[1].Value
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache OpenSSL
        id: tls
        uses: actions/cache@v4
        with:
          path: C:\axial-tls\x64
          key: openssl-${{ env.OPENSSL_VERSION }}-msvc-x64-static-v1
      - name: Build OpenSSL (static, /MT)
        if: steps.tls.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://github.com/openssl/openssl/releases/download/openssl-$env:OPENSSL_VERSION/openssl-$env:OPENSSL_VERSION.tar.gz" -OutFile openssl.tar.gz
          if ((Get-FileHash openssl.tar.gz -Algorithm SHA256).Hash -ne $env:OPENSSL_SHA256) { throw 'OpenSSL checksum mismatch' }
          tar xf openssl.tar.gz
          Push-Location "openssl-$env:OPENSSL_VERSION"
          & C:\Strawberry\perl\bin\perl.exe Configure VC-WIN64A no-shared no-tests no-module no-asm --prefix=C:\axial-tls\x64 --openssldir=C:\axial-tls\x64\ssl
          if ($LASTEXITCODE) { throw 'OpenSSL configure failed' }
          nmake /nologo build_libs
          if ($LASTEXITCODE) { throw 'OpenSSL build failed' }
          nmake /nologo install_dev
          if ($LASTEXITCODE) { throw 'OpenSSL install failed' }
          Pop-Location
      - name: Configure
        run: cmake --preset x64 -DAXIAL_OPENSSL_ROOT=C:\axial-tls\x64 -DAXIAL_VERSION=${{ steps.version.outputs.version }}
      - name: Build
        run: cmake --build --preset x64 --parallel
      - name: Native tests
        run: ctest --preset x64 --timeout 180
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: App model tests
        run: dotnet test app/Axial.Core.Tests -c Release -p:AxialBridgeDirectory=${{ github.workspace }}\build\x64\bin\Release
      - name: Build settings app
        run: dotnet publish app/Axial/Axial.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.version.outputs.version }} -o out/app
      - name: Build x86 adapters (32-bit applications)
        shell: pwsh
        run: |
          cmake --preset x86-adapters -DAXIAL_VERSION=${{ steps.version.outputs.version }}
          if ($LASTEXITCODE) { exit 1 }
          cmake --build --preset x86-adapters --parallel
          if ($LASTEXITCODE) { exit 1 }
      - name: Package installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress; $env:PATH += ';C:\Program Files (x86)\Inno Setup 6' }
          iscc.exe /DAppVersion=${{ steps.version.outputs.version }} /DSourceRoot="$env:GITHUB_WORKSPACE" installer\Axial.iss
          if ($LASTEXITCODE) { exit 1 }
      # The same files as the installer, for running without installing.
      - name: Package portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "out/portable/Axial-${{ steps.version.outputs.version }}-x64"
          New-Item -ItemType Directory -Force "$root/x86" | Out-Null
          Copy-Item -Recurse out/app/* $root
          'axial-service.exe','axialctl.exe','axial-web-setup.exe','axial-bridge.dll','siappdll.dll','TDxNavLib.dll' | ForEach-Object { Copy-Item "build/x64/bin/Release/$_" $root }
          'siappdll.dll','TDxNavLib.dll' | ForEach-Object { Copy-Item "build/x86/bin/Release/$_" "$root/x86" }
          Copy-Item LICENSE, README.md $root
          Compress-Archive -Path $root -DestinationPath "out/installer/Axial-${{ steps.version.outputs.version }}-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Axial-Windows
          path: |
            out/installer/*.exe
            out/installer/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: build/x64/Testing/Temporary/*.log
          if-no-files-found: ignore

  catalog-tests:
    name: App model tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: cmake --preset catalog && cmake --build --preset catalog
      - run: dotnet test app/Axial.Core.Tests -c Release -p:AxialBridgeDirectory=${{ github.workspace }}/build/catalog/bin

  # Pushing a vX.Y.Z tag publishes the installer and portable zip as a release.
  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [windows, catalog-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Axial-Windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Axial $VERSION" --generate-notes
